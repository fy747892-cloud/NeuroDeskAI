services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: neurodesk
      POSTGRES_PASSWORD: neurodesk
      POSTGRES_DB: neurodesk
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neurodesk_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurodesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: neurodesk
      MINIO_ROOT_PASSWORD: neurodesk12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - neurodesk_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://neurodesk:neurodesk@db:5432/neurodesk
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neurodesk_db_data:
  neurodesk_minio_data:
