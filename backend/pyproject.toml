[project]
name = "neurodesk-ai-backend"
version = "0.1.0"
description = "NeuroDesk AI backend (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.0",
    "structlog>=24.4",
    "pgvector>=0.3",
    "cryptography>=42.0",
    "boto3>=1.35",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1",
    "pyotp>=2.10.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
diarization = ["pyannote.audio>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
