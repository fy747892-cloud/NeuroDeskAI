name: neurodesk_ai_mobile
description: NeuroDesk AI mobile MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.9
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_contacts: ^1.1.9+2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  phone_state: ^2.0.6
  record: ^7.1.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.30

flutter:
  uses-material-design: true
  assets:
    - assets/brand/neurodesk_mark.png
