<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı · NeuroDesk AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, "Segoe UI", sans-serif;
        background: #faf8ff;
        color: #131b2e;
        text-align: center;
        padding: 32px;
      }
      h1 { font-size: 22px; margin: 0; }
      p { color: #464555; max-width: 360px; margin: 0; }
      button {
        margin-top: 8px;
        background: #3525cd;
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Şu an çevrimdışısın</h1>
    <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı geri geldiğinde sayfa otomatik çalışacak.</p>
    <button onclick="window.location.reload()">Tekrar dene</button>
  </body>
</html>
